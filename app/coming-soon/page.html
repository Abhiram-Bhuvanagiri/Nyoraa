<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Coming Soon | NYORAA</title>
  <link rel="stylesheet" href="/app/globals.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <style>
    .coming-soon-page {
      background: #FAFAFA;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .coming-soon-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      text-align: center;
    }
    .coming-soon-svg-wrap {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }
    .coming-soon-svg {
      width: 100%;
      height: auto;
      max-height: 55vh;
    }
    .coming-soon-text {
      margin-top: 1.5rem;
    }
    .coming-soon-text h1 {
      font-family: var(--fd, serif);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 600;
      color: #231F20;
      letter-spacing: 0.15em;
      margin: 0 0 0.75rem;
    }
    .coming-soon-text p {
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      color: #808285;
      margin: 0 0 2rem;
    }
    .coming-soon-btn {
      display: inline-block;
      padding: 0.85rem 2.5rem;
      border: 2px solid #231F20;
      border-radius: 50px;
      color: #231F20;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      font-weight: 500;
      transition: all 0.3s;
    }
    .coming-soon-btn:hover {
      background: #231F20;
      color: #fff;
    }
    @media (max-width: 768px) {
      .coming-soon-svg {
        max-height: 40vh;
      }
      .coming-soon-content {
        padding: 1rem;
      }
    }
    @media (max-width: 480px) {
      .coming-soon-svg {
        max-height: 30vh;
      }
    }
  </style>
</head>
<body>
  <div class="coming-soon-page">
    <div id="navbar-container"></div>
    <div class="coming-soon-content">
      <div class="coming-soon-svg-wrap" style="margin-top: 80px;">
        <object
          type="image/svg+xml"
          data="/coming-soon.svg"
          aria-label="Coming Soon Animation"
          class="coming-soon-svg"
        >
          Coming Soon
        </object>
      </div>
      <div class="coming-soon-text">
        <a href="/" class="coming-soon-btn">BACK TO HOME</a>
      </div>
    </div>
  </div>
  
  <script>
    async function loadComponent(url, containerId) {
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const html = await response.text();
        const container = document.getElementById(containerId);
        const fragment = document.createRange().createContextualFragment(html);
        container.replaceWith(fragment);
      } catch (e) {
        console.error('Error loading component ' + url, e);
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await loadComponent('/app/components/Navbar.html', 'navbar-container');
    });
  </script>
</body>
</html>
